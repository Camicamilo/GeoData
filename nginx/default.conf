# Proxy inverso: única puerta de entrada. Escucha 8080/8443 dentro del contenedor
# (publicados como 80/443 en el host) porque corre sin root.

server_tokens off;   # no revelar versión de nginx
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;   # anti fuerza bruta

upstream django {
    server web:8000;
}

server {
    listen 8080;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 5m;   # Django rechaza > 2 MB con mensaje y auditoría

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=3600" always;

    # Los archivos NUNCA se sirven directo: toda descarga pasa por Django (verifica dueño)
    location /media/ { return 404; }
    location /admin  { return 404; }

    location = /accounts/login/ {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
